{% if user.is_authenticated %}
<h2>Your rating</h2>
<form method="post" action="{% url 'rate' place.pk %}">{% csrf_token %}
  <select name="value" aria-label="Your rating">
    {% for n in "12345" %}<option value="{{ n }}"{% if user_rating == n|add:0 %} selected{% endif %}>{{ n }}★</option>{% endfor %}
  </select>
  <button type="submit">Rate</button>
</form>
{% else %}
<p><a href="{% url 'login' %}?next={{ request.path }}">Log in</a> to rate or save this place.</p>
{% endif %}
